name: Build Spritz for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply torrent peer-IP fix
        run: node scripts/patch-tracker.js

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64

      - uses: actions/upload-artifact@v4
        with:
          name: Spritz-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
