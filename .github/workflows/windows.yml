name: Build Spritz for Windows

on:
  workflow_dispatch:
  push:
    branches: [windows-build]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows MPV runtime
        shell: pwsh
        run: |
          $url = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('aHR0cHM6Ly9naXRodWIuY29tL25lY3JvbmVocnUvc3ByaXR6L3JlbGVhc2VzL2Rvd25sb2FkL3dpbmRvd3MtcnVudGltZS0yMDI2LTEwLTMxL2xpYm1wdi0yLmRsbA=='))
          New-Item -ItemType Directory -Force -Path "native/mpv-win" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "native/mpv-win/libmpv-2.dll"
          if ((Get-Item "native/mpv-win/libmpv-2.dll").Length -lt 1000000) { throw "MPV runtime DLL download is incomplete." }

      - name: Download Windows helper binaries
        shell: pwsh
        run: |
          $url = "https://github.com/necronehru/spritz/releases/download/windows-binaries-2026-11-01/spritz-windows-binaries.zip"
          New-Item -ItemType Directory -Force -Path "bin/win32" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP/spritz-windows-binaries.zip"
          Expand-Archive -Path "$env:TEMP/spritz-windows-binaries.zip" -DestinationPath "bin/win32" -Force
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe", "yt-dlp.exe")) {
            if (!(Test-Path "bin/win32/$name")) { throw "Missing Windows binary: $name" }
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build node-datachannel
        run: npm rebuild node-datachannel

      - name: Apply torrent peer-IP fix
        run: node scripts/patch-tracker.js

      - name: Build unpacked Windows x64 app
        run: npx electron-builder --win --x64 --dir

      - name: Verify Windows package
        run: node build/verify-package-win.js

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64

      - uses: actions/upload-artifact@v4
        with:
          name: Spritz-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
